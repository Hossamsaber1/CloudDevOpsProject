---
- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
    state: present

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

- name: Add jenkins user to docker group if Jenkins is already installed
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  ignore_errors: true
